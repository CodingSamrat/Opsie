services:
  opsie-server:
    image: opsie/server:dev
    container_name: opsie-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "2121:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: true
      PORT: 5000
      DATABASE_URL: postgres://opsie:opsie@postgres:5432/opsie
    depends_on:
      - postgres

  opsie-control-panel:
    image: opsie/control-panel:dev
    container_name: opsie-control-panel
    build:
      context: ./control-panel
      dockerfile: Dockerfile
    ports:
      - "1212:3000"
    volumes:
      - ./control-panel:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:2121
      WATCHPACK_POLLING: true

    depends_on:
      - opsie-server

  postgres:
    image: postgres:16
    container_name: opsie-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: opsie
      POSTGRES_PASSWORD: opsie
      POSTGRES_DB: opsie
    volumes:
      - opsie_pg_data:/var/lib/postgresql/data

volumes:
  opsie_pg_data:
    name: opsie_pg_data
